<div class="app-main app-gradient-border">
  <div class="app-menu">
    @for (item of mainMenu; track item.index) {
      <div 
        class="app-menu-item" 
        (click)="onClickManu(item)"
        [class.app-item-select]="item.isSelect">

        <img [src]="item.isSelect?item.selectImg:item.mainIimg" [alt]="item.name">
      </div>
    }
  </div>
  <div class="app-content">
      <router-outlet/>
  </div>
  
</div>
