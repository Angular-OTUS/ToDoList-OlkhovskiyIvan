<div class="tdl-main">
    <div class="tdl-left-side">
        <div class="tdl-header">
            <div class="tdl-header-text">
                <h1>to-do-list</h1> 
            </div>
            <div [matMenuTriggerFor]="menu" class="tdl-header-filter">
                <img [ngSrc]="img.horizontal_settings_mixer" alt="Фильтр" width="52" height="26">
            </div>
        </div>
        <div class="tdl-gradient-border">
            <div class="tdl-content">

                @if (isLoading()) { 

                    <app-spinner></app-spinner>
                } @else { 
                    <div class="tdl-content-body">
                        <div class="tdl-body-scroll">
                            <ul>
                                @for (item of toDoListTask(); track item.id) {
                                    <li>
                                        <app-todo-item 
                                            [taskName]="item.text"
                                            [isSelect]="selectedItemId() === item.id"
                                            (delTask)="onDelTask(item.id)"
                                            (updateTask)="onChangeName($event, item.id)"
                                            (clickTask)="onClickTask(item.id)">
                                        </app-todo-item>
                                    </li>                            
                                }
                            </ul>   
                        </div>
                    </div>
                } 

                <div class="tdl-content-footer">
                    <app-todo-create-item
                        (addTask)="onAddTask($event)">
                        
                    </app-todo-create-item>
                </div>
            </div>
        </div>        
    </div>
    @if (selectedItemId()) {
        <div class="tdl-right-side">
            <div class="tdl-header">     
            </div>
            <div class="tdl-gradient-border">
                <div class="tdl-content">
                    <app-item-description (changeStatus)="onChangeStatus($event)" [taskItem]="selectedItem()"></app-item-description>
                </div>
            </div>
        </div>
    }

</div>

<mat-menu #menu="matMenu">
  <div (click)="loadToDoListTask(null)" [class.tdl-select-item-filter]="selectItemFilter === null" mat-menu-item>
    <span>Все задачи</span>
  </div>
  <div (click)="loadToDoListTask(statusTaskTypes.completed)" [class.tdl-select-item-filter]="selectItemFilter === statusTaskTypes.completed" mat-menu-item>
    <span>Выполненые задачи</span>
  </div>
  <div (click)="loadToDoListTask(statusTaskTypes.inProgress)" [class.tdl-select-item-filter]="selectItemFilter === statusTaskTypes.inProgress" mat-menu-item>
    <span>Невыполненные задачи</span>
  </div>
</mat-menu>
